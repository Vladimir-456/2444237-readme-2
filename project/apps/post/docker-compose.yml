services:
  readme-post.mongo:
    image: mongo:latest
    restart: always
    env_file:
       - ./post.env
    container_name: readme-post.mongo
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    
  readme-post.mongo.ui:
    image: mongo-express:latest
    container_name: readme-post.mongo.ui
    depends_on:
      - readme-post.mongo
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@readme-post.mongo:27017/?authSource=admin

volumes:
  mongo_data: